name: Deploy to GitHub Pages

# Publishes the static homepage from site/ to
# https://d1trepes.github.io/legitlab-redesign/ on every push to main.
# Requires: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.site.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for site
        id: site
        run: |
          if [ -f site/index.html ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Prepare
        if: steps.site.outputs.present == 'true'
        run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.present == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.present == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
